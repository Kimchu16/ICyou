# Builds the ICyou Fabric mod and, when a version tag (e.g. v1.0.0) is pushed,
# attaches the built jar to a GitHub Release so it can be downloaded and
# uploaded to CurseForge.
#
# Two ways to publish to CurseForge:
#   1. (Manual - always works) Download the jar from the generated GitHub
#      Release and upload it on the CurseForge website. Follow the steps in
#      RELEASE_CURSEFORGE.md.
#   2. (Automated - optional) The "Upload to CurseForge" step below pushes the
#      file straight to CurseForge using the CurseForge API. Only runs when a
#      tag is pushed AND the following repository secrets are set:
#        - CURSEFORGE_API_TOKEN   (CurseForge API key with file-upload access)
#        - CURSEFORGE_PROJECT_ID  (numeric CurseForge project id of this mod)
#      If you don't set them, this step is skipped and you use path (1).

name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    env:
      # Referenced via env so we can safely check them in an `if` condition.
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        shell: bash
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Match the built artifact name to the tag (v1.0.0 -> 1.0.0).
            ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}" --no-daemon
          else
            ./gradlew build --no-daemon
          fi

      - name: Locate release jar
        id: jar
        shell: bash
        run: |
          # Pick the main jar (skip the -sources jar).
          RELEASE_JAR="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)"
          if [[ -z "$RELEASE_JAR" ]]; then
            echo "::error::No release jar found in build/libs/"
            exit 1
          fi
          echo "path=${RELEASE_JAR}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${RELEASE_JAR}")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: icyou-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          name: ICyou ${{ steps.jar.outputs.name }}
          generate_release_notes: true

      - name: Upload to CurseForge (optional)
        if: startsWith(github.ref, 'refs/tags/') && env.CURSEFORGE_API_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: TimotheeK/CurseForge-Uploader@v3
        with:
          token: ${{ env.CURSEFORGE_API_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoints: minecraft
          game_versions: "1.21.1"
          file_path: ${{ steps.jar.outputs.path }}
          changelog_type: markdown
          display_name: ICyou ${{ steps.jar.outputs.name }}
          release_type: release
