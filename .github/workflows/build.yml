# Builds the ICyou Fabric mod and, when a version tag (e.g. v1.0.0) is pushed:
#   1. Attaches the built jar to a GitHub Release.
#   2. Auto-uploads the jar to CurseForge when the CURSEFORGE_API_TOKEN and
#      CURSEFORGE_PROJECT_ID repository secrets are configured.
#
# The CurseForge step is skipped (and never blocks the build) if either secret
# is missing, so this workflow is safe to run before you've set them up. To
# enable auto-upload, create the project on CurseForge, generate an API token
# at https://authors.curseforge.com, then add those two secrets. See
# RELEASE_CURSEFORGE.md.

name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - feature/camera-overhaul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    env:
      # References env vars (not secrets) so they can be checked in an `if`.
      # They read as '' when unset, which safely skips the CurseForge step.
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        shell: bash
        run: |
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Match the built artifact name to the tag (v1.0.0 -> 1.0.0).
            ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}" --no-daemon
          else
            ./gradlew build --no-daemon
          fi

      - name: Locate release jar
        id: jar
        shell: bash
        run: |
          # Pick the main jar (skip the -sources jar).
          RELEASE_JAR="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)"
          if [[ -z "$RELEASE_JAR" ]]; then
            echo "::error::No release jar found in build/libs/"
            exit 1
          fi
          echo "path=${RELEASE_JAR}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${RELEASE_JAR}")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: icyou-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          name: ICyou ${{ steps.jar.outputs.name }}
          generate_release_notes: true

      - name: Generate CurseForge changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        shell: bash
        run: |
          {
            echo "## ICyou ${GITHUB_REF_NAME#v}"
            echo
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [[ -n "$PREV" ]]; then
              git log --oneline "${PREV}..${GITHUB_REF_NAME}"
            else
              git log --oneline -20
            fi
          } > CHANGELOG.md
          echo "changelog<<CFEOF" >> "$GITHUB_OUTPUT"
          cat CHANGELOG.md >> "$GITHUB_OUTPUT"
          echo "CFEOF" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/') && env.CURSEFORGE_API_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ env.CURSEFORGE_API_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: ${{ steps.jar.outputs.path }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          changelog_type: markdown
          display_name: ICyou ${{ steps.jar.outputs.name }}
          game_versions: "${{ vars.CF_GAME_VERSIONS || 'Minecraft 1.21.1:1.21.1,Java 21,Fabric' }}"
          release_type: release
          relations: fabric-api:requiredDependency

  server-smoke:
    name: Dedicated server smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Boot and stop a packaged server
        shell: bash
        run: |
          chmod +x gradlew scripts/smoke-server.sh
          scripts/smoke-server.sh

      - name: Upload server smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-smoke-${{ github.sha }}
          path: build/deployment/server-smoke.log
          if-no-files-found: warn

  native-smoke:
    name: Native smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Start and dispose the native runtime
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew nativeSmokeTest --no-daemon

      - name: Upload native smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-smoke-${{ matrix.name }}-${{ github.sha }}
          path: |
            build/reports/tests/nativeSmokeTest
            build/test-results/nativeSmokeTest
          if-no-files-found: warn

