import groovy.json.JsonSlurper
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream

plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric maven is already configured in settings.gradle. Add others here if needed.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'

    implementation include('dev.onvoid.webrtc:webrtc-java:0.16.0')
    ['windows-x86_64', 'linux-x86_64', 'linux-aarch64', 'linux-aarch32',
     'macos-x86_64', 'macos-aarch64'].each { platform ->
        implementation include(group: 'dev.onvoid.webrtc', name: 'webrtc-java',
                version: '0.16.0', classifier: platform)
    }
}

test {
    useJUnitPlatform()
}

tasks.register('nativeSmokeTest', Test) {
    group = 'verification'
    description = 'Starts and disposes the packaged WebRTC runtime for this host.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/WebRtcNativeRuntimeTest.class'
    systemProperty 'icyou.nativeSmoke', 'true'
    outputs.upToDateWhen { false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks release metadata, entrypoints, and bundled native runtimes.'
    dependsOn tasks.named('remapJar')

    doLast {
        File archive = tasks.named('remapJar').get().archiveFile.get().asFile
        Map<String, String> nativeJars = [
                'webrtc-java-0.16.0-windows-x86_64.jar': 'webrtc-java-windows-x86_64.dll',
                'webrtc-java-0.16.0-linux-x86_64.jar'  : 'libwebrtc-java-linux-x86_64.so',
                'webrtc-java-0.16.0-linux-aarch64.jar' : 'libwebrtc-java-linux-aarch64.so',
                'webrtc-java-0.16.0-linux-aarch32.jar' : 'libwebrtc-java-linux-aarch32.so',
                'webrtc-java-0.16.0-macos-x86_64.jar'  : 'libwebrtc-java-macos-x86_64.dylib',
                'webrtc-java-0.16.0-macos-aarch64.jar' : 'libwebrtc-java-macos-aarch64.dylib'
        ]
        new ZipFile(archive).withCloseable { distribution ->
            def metadataEntry = distribution.getEntry('fabric.mod.json')
            if (metadataEntry == null) throw new GradleException(
                    'Release JAR is missing fabric.mod.json')
            def metadata = new JsonSlurper().parse(
                    distribution.getInputStream(metadataEntry))
            if (metadata.id != 'icyou' || metadata.version != project.version.toString()) {
                throw new GradleException('Release JAR metadata has the wrong ID or version')
            }
            ['com/matissjurevics/icyou/ICyouMod.class',
             'com/matissjurevics/icyou/client/ICyouClient.class',
             'META-INF/jars/webrtc-java-0.16.0.jar'].each { path ->
                if (distribution.getEntry(path) == null) {
                    throw new GradleException("Release JAR is missing ${path}")
                }
            }
            nativeJars.each { nestedName, nativeName ->
                def nestedEntry = distribution.getEntry("META-INF/jars/${nestedName}")
                if (nestedEntry == null || nestedEntry.size < 1_000_000) {
                    throw new GradleException("Release JAR has no usable ${nestedName}")
                }
                boolean found = false
                new ZipInputStream(distribution.getInputStream(nestedEntry)).withCloseable {
                    nested ->
                        def entry
                        while ((entry = nested.nextEntry) != null) {
                            if (entry.name == nativeName) {
                                found = true
                                break
                            }
                        }
                }
                if (!found) {
                    throw new GradleException(
                            "${nestedName} is missing native payload ${nativeName}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseJar')
}
